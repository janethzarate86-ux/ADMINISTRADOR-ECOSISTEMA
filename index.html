<title>MACROXEL · Administrador del Ecosistema</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#041225;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#mxFrame{display:block;width:100%;height:100%;border:0;background:#041225}
#mxLoad{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#041225;color:#fff;font-size:13px;font-weight:800;letter-spacing:.04em;transition:opacity .2s ease}
#mxLoad.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="mxLoad">Abriendo Administrador del Ecosistema…</div>
<iframe id="mxFrame" title="MACROXEL Administrador del Ecosistema" allow="autoplay; clipboard-read; clipboard-write" referrerpolicy="same-origin"></iframe>
<script>
(()=>{'use strict';
  const CENTRAL=location.origin+'/ECOSISTEMA-MACROXEL-HOSPITAL/MACROXEL-VISORES-CENTRAL/ADMINISTRADOR-ECOSISTEMA/';
  const suffix=(location.search||'')+(location.hash||'');
  const frame=document.getElementById('mxFrame');
  const load=document.getElementById('mxLoad');
  frame.addEventListener('load',()=>{load.classList.add('hide');setTimeout(()=>load.remove(),240)},{once:true});
  frame.src=CENTRAL+suffix;
  setTimeout(()=>load?.classList.add('hide'),12000);
})();
</script>
</body>
